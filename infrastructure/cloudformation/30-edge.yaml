AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Cloud Time Machine - edge layer. A WAF web ACL with managed rule sets and a
  rate-based rule, and a CloudFront distribution that serves the static front
  end from S3 and forwards /api/* to the load balancer. Must be deployed in
  us-east-1 because CloudFront-scoped WAF and certificates live there.

Parameters:
  ProjectName:
    Type: String
    Default: cloud-time-machine
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
  OriginSecret:
    Type: String
    NoEcho: true
    MinLength: 16
    Description: Must match the value given to 20-app.yaml.
  RateLimitPerFiveMinutes:
    Type: Number
    Default: 2000
    MinValue: 100
    Description: Requests per five minutes from one IP before WAF blocks it.
  DomainName:
    Type: String
    Default: ''
    Description: Optional custom domain. Leave empty to use the cloudfront.net name.
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate in us-east-1. Required only with a custom domain.
  PriceClass:
    Type: String
    Default: PriceClass_100
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_100 is North America and Europe only, and the cheapest.

Conditions:
  HasDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref CertificateArn, '']]

Resources:
  # ------------------------------------------------------------------- WAF
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub '${ProjectName}-${Environment}-waf'
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${ProjectName}-${Environment}-waf'
      Rules:
        - Name: rate-limit-per-ip
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerFiveMinutes
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: rate-limit-per-ip
        - Name: aws-common-rules
          Priority: 1
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-common-rules
        - Name: aws-known-bad-inputs
          Priority: 2
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesKnownBadInputsRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-known-bad-inputs
        - Name: aws-ip-reputation
          Priority: 3
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesAmazonIpReputationList
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: aws-ip-reputation

  # ------------------------------------------------------------ CloudFront
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${ProjectName}-${Environment}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ApiCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub '${ProjectName}-${Environment}-api-no-cache'
        DefaultTTL: 0
        MinTTL: 0
        MaxTTL: 1
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: all

  ApiOriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub '${ProjectName}-${Environment}-api-forward'
        CookiesConfig:
          CookieBehavior: none
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - x-session-id
            - content-type
            - origin
        QueryStringsConfig:
          QueryStringBehavior: all

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub '${ProjectName} ${Environment}'
        PriceClass: !Ref PriceClass
        HttpVersion: http2and3
        IPV6Enabled: true
        WebACLId: !GetAtt WebAcl.Arn
        DefaultRootObject: index.html
        Aliases: !If [HasDomain, [!Ref DomainName], !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: web-bucket
            DomainName: !ImportValue
              'Fn::Sub': '${ProjectName}-${Environment}-web-bucket-domain'
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: api-alb
            DomainName: !ImportValue
              'Fn::Sub': '${ProjectName}-${Environment}-alb-dns'
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 30
            OriginCustomHeaders:
              # Proves to the load balancer that the request came through
              # CloudFront rather than straight at the origin.
              - HeaderName: x-origin-secret
                HeaderValue: !Ref OriginSecret
        DefaultCacheBehavior:
          TargetOriginId: web-bucket
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD, OPTIONS]
          # AWS managed CachingOptimized policy.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: api-alb
            ViewerProtocolPolicy: https-only
            Compress: true
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
          - PathPattern: /events
            TargetOriginId: api-alb
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref ApiCachePolicy
            OriginRequestPolicyId: !Ref ApiOriginRequestPolicy
        CustomErrorResponses:
          # The front end is a single-page app, so an unknown path is a route
          # for the client to resolve, not a missing object.
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 10

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !ImportValue
        'Fn::Sub': '${ProjectName}-${Environment}-web-bucket'
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub
              - '${BucketArn}/*'
              - BucketArn: !ImportValue
                  'Fn::Sub': '${ProjectName}-${Environment}-web-bucket-arn'
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'

Outputs:
  DistributionId:
    Value: !Ref Distribution
    Export:
      Name: !Sub '${ProjectName}-${Environment}-distribution-id'
  DistributionDomainName:
    Value: !GetAtt Distribution.DomainName
    Export:
      Name: !Sub '${ProjectName}-${Environment}-distribution-domain'
  SiteUrl:
    Description: Open this in a browser.
    Value: !If
      - HasDomain
      - !Sub 'https://${DomainName}'
      - !Sub 'https://${Distribution.DomainName}'
  WebAclArn:
    Value: !GetAtt WebAcl.Arn
    Export:
      Name: !Sub '${ProjectName}-${Environment}-waf-arn'
